<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sampleImport - TTHS Vanilla JS in another page</title>
  <!--
    This page demonstrates importing the vanilla JS client into a DIFFERENT
    HTML page and printing with a single function call. Only the three script
    tags below are needed - no build step, no dependencies. Everything else
    on this page is plain HTML/CSS/JS owned by the importing page.

    The scripts do all platform work in the background: connect -> wait for
    ConnectionStatus "master" -> 4-step ACK-chained init -> application ACTIVE.
    After that, printing is one call:

        KioskSample.printBoardingPass()              // default sample print
        KioskSample.bpp.printFields({ name: "..." }) // with changed texts
  -->
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1f2937; }
    h1 { font-size: 20px; }
    .status { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
    .status .ok { color: #059669; font-weight: 600; }
    fieldset { border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 16px; }
    legend { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; padding: 0 6px; }
    .row { display: flex; gap: 12px; margin: 8px 0; flex-wrap: wrap; }
    label { font-size: 12px; color: #4b5563; display: block; margin-bottom: 2px; }
    input { font-size: 14px; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; width: 150px; }
    button { font-size: 14px; padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; background: #7c3aed; color: #fff; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button.secondary { background: #e5e7eb; color: #374151; }
    .result { font-size: 13px; margin-top: 16px; min-height: 20px; }
    .result .ok { color: #059669; font-weight: 600; }
    .result .err { color: #dc2626; font-weight: 600; }
  </style>
</head>
<body>
  <h1>sampleImport</h1>
  <p class="status">
    Status: <span id="status">connecting...</span>
  </p>

  <form id="print-form" onsubmit="return false;">
    <fieldset>
      <legend>Boarding pass texts (empty = keep the default sample value)</legend>
      <div class="row">
        <div>
          <label for="inp-name">Gamer Name (2D)</label>
          <input id="inp-name" placeholder="MESUT YILMAZ">
        </div>
        <div>
          <label for="inp-points">Points (3B)</label>
          <input id="inp-points" placeholder="1500P">
        </div>
      </div>
      <div class="row">
        <div>
          <label for="inp-leaderboardnumber">Leader Board Number (3C)</label>
          <input id="inp-leaderboardnumber" placeholder="-01-">
        </div>
        <div>
          <label for="inp-barcodeText">Barcode Text (4B)</label>
          <textarea id="inp-barcodeText" style="width: 300px; height: 100px;">TEKNOFESTE HOSGELDIN MESUT TURK HAVA YOLLARI TEKNOLOJI EKIBI OLARAK BU KODU OKUMANDAN DOLAYI FARKINDALIGIN VE MERAKIN ICIN TEBRIK EDERIZ.</textarea>
        </div>
      </div>
    </fieldset>

    <button id="btn-print" type="button" disabled>Print boarding pass</button>
  </form>

  <p class="result" id="result"></p>

  <!-- Import the vanilla JS client (classic scripts - works from file:// or any static server) -->
  <script src="js/platform.js"></script>
  <script src="js/bpp-printer.js"></script>
  <script src="js/app.js"></script>

  <!-- This page's own code. DOMContentLoaded listeners run in registration
       order, so app.js's boot() has already created window.KioskSample here. -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (!window.KioskSample) {
        console.error("KioskSample not available - did the script tags load?");
        return;
      }

      var statusEl = document.getElementById("status");
      var resultEl = document.getElementById("result");
      var btnPrint = document.getElementById("btn-print");

      // ---- Reflect connection/init state in this page's own UI ----------

      function refreshStatus() {
        var state = window.KioskSample.client.getState();
        var ready = window.KioskSample.client.isInitialized();
        statusEl.textContent = state + (ready ? " - init complete, app ACTIVE" : " - initializing...");
        statusEl.className = ready ? "ok" : "";
        btnPrint.disabled = !ready;
      }

      window.KioskSample.client.on("stateChange", refreshStatus);
      window.KioskSample.client.on("initComplete", refreshStatus);
      refreshStatus();

      // ---- Show the print result from the platform ----------------------

      window.KioskSample.bpp.onPrintResult(function (r) {
        while (resultEl.firstChild) {
          resultEl.removeChild(resultEl.firstChild);
        }
        var span = document.createElement("span");
        span.className = r.ok ? "ok" : "err";
        span.textContent = (r.statusLabel || r.statusCode || r.eventType) +
          (r.errorMessage ? " - " + r.errorMessage : "");
        resultEl.appendChild(span);
      });

      // ---- Collect the form fields into CP field overrides --------------

      function collectOverrides() {
        var overrides = {};
        var name = document.getElementById("inp-name").value.trim();
        var points = document.getElementById("inp-points").value.trim();
        var leaderboard = document.getElementById("inp-leaderboardnumber").value.trim();
        var barcodeText = document.getElementById("inp-barcodeText").value.trim();

        // var date = document.getElementById("inp-date").value.trim();
        // var seat = document.getElementById("inp-seat").value.trim();
        // var boarding = document.getElementById("inp-boarding").value.trim();

        if (name) overrides["2D"] = name;     
        if (points) overrides["3B"] = points;    
        if (leaderboard) overrides["3C"] = leaderboard;             
        if (barcodeText) overrides["4B"] = barcodeText;             
        return overrides;
      }

      // ---- The single-function print -------------------------------------

      btnPrint.addEventListener("click", function () {
        var overrides = collectOverrides();
        var correlationId;
        if (Object.keys(overrides).length === 0) {
          correlationId = window.KioskSample.printBoardingPass();
        } else {
          correlationId = window.KioskSample.bpp.printFields(overrides);
        }
        if (correlationId) {
          resultEl.textContent = "Print command sent (" + correlationId + "), waiting for result...";
        } else {
          resultEl.textContent = "Not ready yet - connection/init incomplete.";
        }
      });
    });
  </script>
</body>
</html>
