<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bagaj Atölyesi — Turkish Technology</title>
  <!-- Yazı tipleri Google'dan DEĞİL, assets/fonts/ içinden yükleniyor
       (@font-face kuralları style.css'in başında). Kiosk internetsiz
       çalışacağı için dışarıdan font çekmek riskliydi. -->
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= SAHNE =================
     Her şey 9:16 dikey bir kutunun içinde. Kiosk ekranı dikey; geliştirme
     makinesinde pencere hangi orana gelirse gelsin oyun aynı görünsün diye
     sahne oranı KİLİTLİ, ölçüler script.js'te sahne genişliğinden türetiliyor. -->
<div id="sahne">

  <!-- ================= MANZARA =================
       Sahnenin üst yarısının arkasında duran İstanbul görseli. Kendi
       oranıyla çiziliyor (esnetilmiyor); alt kenarı tahtanın arkasında
       kalıyor, o yüzden görselin alt şeridine önemli bir şey denk
       gelmemeli. -->
  <img id="manzara" class="manzara" alt="" aria-hidden="true">
  <!-- Manzaranın üstündeki sis: görsel olduğu gibi bırakılınca ön plandaki
       tezgah ve uçaklarla aynı netlikte duruyor ve sahne düzleşiyor. Bu
       katman onu geriye itiyor. -->
  <div id="sis" aria-hidden="true"></div>

  <!-- ÜST BİLGİ: tamamlanan sipariş / puan / geçen süre.
       Her kutu bir görsel + onun krem alanına yazılan bir sayı. Simge
       hangisinin ne olduğunu anlatıyor, o yüzden görsel geldiğinde yazı
       etiketleri gizleniyor (Türkçe "SİPARİŞ/SÜRE" görselde üretilemiyor,
       İ ve Ü bozuk çıkıyor). Görsel yoksa etiketler geri geliyor. -->
  <div id="hud">
    <div class="hud-kutu" data-hud="siparis">
      <img class="hud-gorsel" alt="" aria-hidden="true">
      <span class="hud-etiket">SİPARİŞ</span><span class="hud-deger" id="hudSiparis">0/6</span>
    </div>
    <div class="hud-kutu" data-hud="puan">
      <img class="hud-gorsel" alt="" aria-hidden="true">
      <span class="hud-etiket">PUAN</span><span class="hud-deger" id="hudPuan">0</span>
    </div>
    <div class="hud-kutu" data-hud="sure">
      <img class="hud-gorsel" alt="" aria-hidden="true">
      <span class="hud-etiket">SÜRE</span><span class="hud-deger" id="hudSure">02:00</span>
    </div>
  </div>

  <!-- ================= TEZGAH VE UÇAKLAR =================
       Tezgah tek bir görsel; uçaklar onun ÜST YÜZEYİNE basıyor. Bastıkları
       yükseklik görselden ölçüldü (script.js TEZGAH tablosu) — göz kararı
       yerleştirilirse uçaklar havada ya da tezgaha gömülü durur.

       Her park yerinde arkada uçak, önünde biniş kartı biçiminde plaka var;
       plakanın üstünde uçağın istediği bagaj ve uçuş bilgisi yazıyor.
       İçeriği script dolduruyor. -->
  <div id="tezgah">
    <img id="tezgahImg" class="tezgah-gorsel" alt="" aria-hidden="true">
    <div id="ucaklar"></div>
  </div>

  <!-- ================= MERGE MATRİSİ =================
       5 sütun × 6 satır. Hücreler script'te üretiliyor; biri sabit olarak
       BAGAJ BANDI (makine) — üstüne basınca komşu boş hücrelere hediyelik
       düşürür. Aynı iki hediyelik birleşince bir üst basamağa çıkar. -->
  <div id="izgara"></div>

  <!-- Parmağın altında sürüklenen kopya. Hücrenin içindeki asıl parça yerinde
       kalır (yarı saydam), taşınan bu katmandır — sürükleme ızgaranın dışına,
       uçakların üstüne kadar çıkabilsin diye sahne seviyesinde duruyor. -->
  <div id="surukle" class="gizli"></div>

  <!-- Kısa geri bildirimler: "+120", "yanlış uçak" gibi. Script yerleştirir. -->
  <div id="baloncuklar"></div>
</div>

<!-- ================= BAŞLANGIÇ =================
     Tasarımın tamamı tek bir görsel olacak (assets/home_page.png). O gelene
     kadar geçici bir panel duruyor; tüm ekran dokunmatik, çocuk nereye basarsa
     bassın oyun başlar. -->
<div id="basScreen" class="katman">
  <img id="basBg"  class="katman-bg"  alt="" aria-hidden="true">
  <img id="basImg" class="katman-img" alt="Bagaj Atölyesi">
  <div class="gecici-panel" id="basGecici">
    <h1>BAGAJ ATÖLYESİ</h1>
    <p>Hediyelikleri birleştir, bagajı hazırla, doğru uçağa yükle.</p>
    <span class="gecici-not">geçici ekran — tasarım görseli gelince kalkacak</span>
  </div>
  <button id="basBtn" class="katman-hit" aria-label="Oyna"></button>
</div>

<!-- ================= BİTİŞ ================= -->
<div id="bitScreen" class="katman gizli">
  <img id="bitBg"  class="katman-bg"  alt="" aria-hidden="true">
  <img id="bitImg" class="katman-img" alt="">
  <div class="gecici-panel" id="bitGecici">
    <!-- Başlık sonuca göre değişiyor: altı sipariş yetiştiyse tebrik,
         süre dolduysa "süre doldu". Script dolduruyor. -->
    <h1 id="bitBaslik">TEBRİKLER</h1>
    <p class="bit-satir">Tamamlanan sipariş: <b id="bitSiparis">0/6</b></p>
    <p class="bit-satir">Kalan süre: <b id="bitSure">00:00</b></p>
    <p class="bit-puan"><b id="bitPuan">0</b> puan</p>
    <span class="gecici-not">geçici ekran — tasarım görseli gelince kalkacak</span>
  </div>
  <button id="bitBtn" class="katman-hit" aria-label="Tekrar oyna"></button>
</div>

<script src="script.js"></script>
</body>
</html>
